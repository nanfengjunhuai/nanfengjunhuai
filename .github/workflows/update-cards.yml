name: Refresh profile cards

# Redraws the data-driven cards from live GitHub data, so the profile stays
# accurate without anyone remembering to run anything.
#
# Only the cards under "Refresh" below are on the cron. The hero and the stack
# strip are generated too, but from fixed inputs (a solved device model, and
# brand paths pinned under assets/icons/), so their output cannot drift with
# time — regenerating them daily would only add empty commits.
#
# Runs on a cron rather than on every push: contributions and follower counts
# change when you work in *other* repos too, and those pushes never land here.
# 03:17 UTC = 11:17 Beijing time. The odd minute avoids the top-of-hour stampede
# on GitHub's scheduler, where jobs at :00 are the most delayed.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render.py"
      - ".github/workflows/update-cards.yml"

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate cards from the GitHub API
        env:
          # Lets the script read the contribution calendar over GraphQL.
          # Without it the card falls back to the public event log.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/render.py

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg \
                  assets/langs-dark.svg assets/langs-light.svg
          if git diff --quiet --cached; then
            echo "cards unchanged — nothing to commit"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
